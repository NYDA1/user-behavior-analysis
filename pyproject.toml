[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "user-behavior-analysis"
version = "0.1.0"
description = "E-commerce user behavior analysis: sessionization, funnel analysis, churn prediction, and an interactive dashboard"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pandas>=3.0",
    "numpy>=2.0",
    "matplotlib>=3.10",
    "plotly>=6.0",
    "scikit-learn>=1.8",
    "streamlit>=1.40",
    "pyarrow>=15",
]

[project.optional-dependencies]
dev = ["pytest>=8", "xgboost>=2.1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
